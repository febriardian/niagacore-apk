name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:fresh
      - run: pnpm migrations:check
      - run: pnpm database:contract
      - run: pnpm release:audit
      - run: pnpm release:evidence
      - run: pnpm --filter @niagacore/mobile exec expo export --platform android --clear
        env:
          EXPO_OFFLINE: "1"