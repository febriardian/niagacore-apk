name: Signed Android release

on:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm dlx eas-cli@21.7.0 build --platform android --profile production --non-interactive --wait --json > eas-build.json
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Download EAS APK
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('apps/mobile/eas-build.json'));const b=Array.isArray(j)?j[0]:j;const u=b.artifacts?.buildUrl;if(!u)throw Error('APK URL missing');fs.writeFileSync('apk-url.txt',u)"
          curl --fail --location "$(cat apk-url.txt)" --output NiagaCore-2.12.0.apk
      - uses: android-actions/setup-android@v3
      - run: pnpm release:apk ./NiagaCore-2.12.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NiagaCore-2.12.0-signed
          path: |
            NiagaCore-2.12.0.apk
            apps/distribution-web/releases/release.json
          if-no-files-found: error
          retention-days: 30
