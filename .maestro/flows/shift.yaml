appId: id.niagacore.app
name: Buka dan tutup shift
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Masuk"
    file: _login.yaml
- tapOn: "Kasir"
- runFlow:
    when:
      visible: "Buka shift"
    commands:
      - tapOn: "Buka shift"
      - tapOn: "Saldo kas awal"
      - inputText: "0"
      - tapOn: "Buka shift"
- assertVisible: "Shift aktif"
- tapOn: "Tutup shift"
- tapOn: "Kas aktual"
- inputText: ${TEST_SHIFT_CASH}
- tapOn: "Hitung & tutup shift"
- assertVisible: "Shift ditutup|Tutup"
